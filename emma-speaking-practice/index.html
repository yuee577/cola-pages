<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>EMMA 口语小练习</title>
  <style>
    :root {
      --ink: #243333;
      --muted: #6d7c78;
      --paper: #f7f5ef;
      --card: #fffefa;
      --green: #315f52;
      --green-dark: #244b40;
      --mint: #e5efe9;
      --line: #e7e7dd;
      --orange: #dd845a;
      --shadow: 0 18px 55px rgba(47, 71, 61, .09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(221,132,90,.11), transparent 23rem),
        radial-gradient(circle at 95% 25%, rgba(90,139,116,.10), transparent 25rem),
        var(--paper);
      font-family: ui-rounded, "Aptos", "Segoe UI", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .page { width: min(100% - 28px, 760px); margin: 0 auto; padding: 23px 0 30px; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--green); }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: var(--green); color: white; font-size: 17px; letter-spacing: 0; }
    .top-note { color: var(--muted); font-size: 12px; }
    .intro { margin: 0 0 20px; }
    .eyebrow { margin: 0 0 8px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(27px, 7vw, 42px); line-height: 1.13; letter-spacing: -.045em; }
    .intro-copy { margin: 11px 0 0; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 16px; }
    .step { display: flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,254,250,.68); color: #52635d; font-size: 12px; }
    .step b { display: grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--mint); color: var(--green); font-size: 11px; }
    .practice { overflow: hidden; border: 1px solid rgba(255,255,255,.8); border-radius: 25px; background: var(--card); box-shadow: var(--shadow); }
    .practice-head { display: flex; justify-content: space-between; align-items: center; padding: 17px 19px 13px; }
    .counter { color: var(--muted); font-size: 13px; font-weight: 700; }
    .category { padding: 6px 10px; border-radius: 999px; background: #f2eee3; color: #786e55; font-size: 11px; font-weight: 800; }
    .progress { height: 4px; margin: 0 19px; overflow: hidden; border-radius: 9px; background: #edf0e9; }
    .progress-fill { width: 6.25%; height: 100%; border-radius: inherit; background: var(--green); transition: width .25s ease; }
    .question-area { min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 27px 19px 23px; text-align: center; }
    .prompt-label { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .play-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 204px; min-height: 62px; padding: 13px 21px; border: 0; border-radius: 18px; background: var(--green); color: #fff; font-weight: 800; font-size: 17px; cursor: pointer; box-shadow: 0 9px 19px rgba(49,95,82,.20); transition: transform .15s, background .15s; }
    .play-button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .play-button:active { transform: translateY(1px); }
    .play-icon { font-size: 19px; line-height: 1; }
    .question-text { margin: 18px 0 0; color: var(--green-dark); font-size: clamp(21px, 5.8vw, 30px); font-weight: 750; line-height: 1.3; }
    .question-text[hidden] { display: none; }
    .context { margin-top: 14px; min-height: 34px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .horses { margin-top: 5px; font-size: 26px; letter-spacing: 5px; }
    .actions { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; padding: 0 15px 18px; }
    .btn { min-height: 43px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer; }
    .btn:hover { border-color: #b8c9be; background: #f8fbf8; }
    .btn:focus-visible, .play-button:focus-visible { outline: 3px solid rgba(221,132,90,.55); outline-offset: 3px; }
    .btn-primary { border-color: var(--green); background: var(--green); color: #fff; }
    .btn-primary:hover { border-color: var(--green-dark); background: var(--green-dark); }
    .answer-panel { margin: 0 16px 17px; padding: 16px; border: 1px solid #dce8df; border-radius: 17px; background: #f1f7f1; text-align: left; }
    .answer-panel[hidden] { display: none; }
    .answer-title { margin: 0 0 9px; color: var(--green); font-size: 12px; font-weight: 850; letter-spacing: .04em; }
    .answer-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .answer-list li { padding: 8px 10px; border-radius: 10px; background: white; color: #2a4439; font-size: 15px; font-weight: 700; }
    .answer-note { margin: 10px 0 0; color: #62746b; font-size: 12px; line-height: 1.5; }
    .nav-row { display: flex; justify-content: space-between; gap: 10px; padding: 0 16px 17px; }
    .nav-row .btn { min-width: 98px; }
    .footnote { margin: 15px 2px 0; color: #75817b; font-size: 12px; line-height: 1.6; text-align: center; }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); max-width: calc(100% - 28px); padding: 11px 15px; border-radius: 12px; background: #253832; color: #fff; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 430px) {
      .page { width: min(100% - 22px, 760px); padding-top: 17px; }
      .topline { margin-bottom: 23px; }
      .top-note { max-width: 120px; text-align: right; line-height: 1.35; }
      .question-area { min-height: 256px; }
      .actions { padding-left: 10px; padding-right: 10px; }
      .btn { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">E</span><span>EMMA · SPEAK &amp; ANSWER</span></div>
      <div class="top-note">课堂口语 · 回家也能练</div>
    </header>

    <section class="intro" aria-labelledby="title">
      <p class="eyebrow">A little practice, every day</p>
      <h1 id="title">听懂了，就马上回答。</h1>
      <p class="intro-copy">先听问题，自己用英语说。想好以后，再打开参考答案检查。</p>
      <div class="steps" aria-label="练习步骤">
        <span class="step"><b>1</b> 听问题</span>
        <span class="step"><b>2</b> 先开口</span>
        <span class="step"><b>3</b> 看答案</span>
      </div>
    </section>

    <section class="practice" aria-label="口语练习卡片">
      <div class="practice-head">
        <span class="counter" id="counter">第 1 题 / 16</span>
        <span class="category" id="category">日常问答</span>
      </div>
      <div class="progress" role="progressbar" aria-label="练习进度" aria-valuemin="1" aria-valuemax="16" aria-valuenow="1"><div class="progress-fill" id="progressFill"></div></div>

      <div class="question-area">
        <p class="prompt-label">准备好了吗？先听英文，不急着看文字。</p>
        <button class="play-button" id="playButton" type="button" aria-label="播放英文问题">
          <span class="play-icon" aria-hidden="true">▶</span><span>听问题</span>
        </button>
        <p class="question-text" id="questionText" hidden></p>
        <div class="context" id="context"></div>
      </div>

      <div class="actions">
        <button class="btn" id="textButton" type="button" aria-expanded="false">看英文问句</button>
        <button class="btn" id="speedButton" type="button" aria-pressed="false">语速：慢速</button>
        <button class="btn btn-primary" id="answerButton" type="button" aria-expanded="false">看参考答案</button>
      </div>

      <div class="answer-panel" id="answerPanel" hidden>
        <p class="answer-title">参考回答（说法不止一种，先把自己的答案说出来）</p>
        <ul class="answer-list" id="answerList"></ul>
        <p class="answer-note" id="answerNote"></p>
      </div>

      <div class="nav-row">
        <button class="btn" id="prevButton" type="button">← 上一题</button>
        <button class="btn btn-primary" id="nextButton" type="button">下一题 →</button>
      </div>
    </section>

    <p class="footnote">这个网页播放的是 EMMA 老师的原声录音，每次打开题目顺序都会打乱。它不会录下或上传孩子的声音，也不会自动评分。口头回答后，再用参考答案自查。</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const questions = [
      { q: 'How are you?', category: '日常问答', answers: ["I'm fine, thank you.", "I'm good.", "I'm great.", "I'm okay."], note: '选一句符合自己感受的回答就可以。' },
      { q: "What's your name?", category: '个人信息', answers: ['My name is ___.', "I'm ___."], note: '把空格换成自己的名字。' },
      { q: "How's the weather?", category: '天气', context: '想一想今天的天气，再用英语回答。', answers: ["It's sunny.", "It's cloudy.", "It's rainy.", "It's windy."], note: '根据今天实际的天气选一句。' },
      { q: 'What day is it today?', category: '星期', answers: [`It's ${weekdays[new Date().getDay()]}.`], note: '参考答案按打开网页的手机日期显示。' },
      { q: 'Do you like ice cream?', category: 'Do you 问答', answers: ['Yes, I do.', "No, I don't."], note: '按自己的真实喜好回答。' },
      { q: 'Do you have black eyes?', category: 'Do you 问答', answers: ['Yes, I do.', "No, I don't."], note: 'eyes 是复数，所以前面不加 a。' },
      { q: 'Can you swim?', category: 'Can you 问答', answers: ['Yes, I can.', "No, I can't."], note: '按自己会不会游泳回答。' },
      { q: 'Can he swim?', category: 'Can he 问答', answers: ['Yes, he can.', "No, he can't."], note: '回答时记得用 he。' },
      { q: 'Are you farmers?', category: 'Are you 复数问答', context: '这题由几个人一起回答。', answers: ['Yes, we are.', "No, we aren't."], note: '几个人一起回答时，用 we。' },
      { q: 'Are you a teacher?', category: 'Are you 问答', answers: ['Yes, I am.', "No, I'm not."], note: '一个人回答时，用 I。' },
      { q: 'Is he a nurse?', category: 'Is he 问答', answers: ['Yes, he is.', "No, he isn't."], note: '回答时记得用 he。' },
      { q: 'How many horses are there?', category: '数量问答', visual: '🐴　🐴　🐴', answers: ['There are three horses.'], note: '看图数一数：一共有三匹马。' },
      { q: 'What do you like to do?', category: '喜好活动', answers: ['I like to read books.', 'I like to play football.', 'I like to draw pictures.'], note: '选一个自己喜欢做的活动，也可以换成自己的答案。' },
      { q: "What's your phone number?", category: '个人信息', answers: ["It's ___.", 'My phone number is ___.'], note: '练习时可以用虚构号码，不必说自己的真实号码。' },
      { q: 'Are you at home?', category: 'Are you 问答', answers: ['Yes, I am.', "No, I'm not."], note: '按自己现在是否在家回答。' },
      { q: 'Is your mom at home?', category: 'Is your mom 问答', answers: ['Yes, she is.', "No, she isn't."], note: '回答时用 she。' }
    ];

    // 教师原声：q01–q14 对应上面前 14 题（按清单顺序）；q15、q16 待补录，暂用系统合成音兜底
    questions.forEach((item, i) => {
      item.audio = i < 14 ? `audio/q${String(i + 1).padStart(2, '0')}.mp3` : null;
    });

    // 每次打开网页，题目顺序随机打乱
    for (let i = questions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [questions[i], questions[j]] = [questions[j], questions[i]];
    }

    let current = 0;
    let slow = true;
    let toastTimer;
    const questionAudio = new Audio();
    questionAudio.preload = 'auto';
    const counter = document.getElementById('counter');
    const category = document.getElementById('category');
    const progress = document.querySelector('.progress');
    const progressFill = document.getElementById('progressFill');
    const questionText = document.getElementById('questionText');
    const context = document.getElementById('context');
    const answerPanel = document.getElementById('answerPanel');
    const answerList = document.getElementById('answerList');
    const answerNote = document.getElementById('answerNote');
    const textButton = document.getElementById('textButton');
    const answerButton = document.getElementById('answerButton');
    const speedButton = document.getElementById('speedButton');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const toast = document.getElementById('toast');

    function renderQuestion() {
      const item = questions[current];
      counter.textContent = `第 ${current + 1} 题 / ${questions.length}`;
      category.textContent = item.category;
      progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;
      progress.setAttribute('aria-valuenow', String(current + 1));
      questionText.textContent = item.q;
      questionText.hidden = true;
      textButton.textContent = '看英文问句';
      textButton.setAttribute('aria-expanded', 'false');
      context.innerHTML = '';
      if (item.context) {
        const hint = document.createElement('span');
        hint.textContent = item.context;
        context.appendChild(hint);
      }
      if (item.visual) {
        const visual = document.createElement('div');
        visual.className = 'horses';
        visual.setAttribute('aria-label', '三匹马');
        visual.textContent = item.visual;
        context.appendChild(visual);
      }
      answerPanel.hidden = true;
      answerButton.textContent = '看参考答案';
      answerButton.setAttribute('aria-expanded', 'false');
      answerList.innerHTML = '';
      item.answers.forEach(answer => {
        const li = document.createElement('li');
        li.textContent = answer;
        answerList.appendChild(li);
      });
      answerNote.textContent = item.note || '';
      prevButton.disabled = current === 0;
      prevButton.style.opacity = current === 0 ? '.48' : '1';
      nextButton.textContent = current === questions.length - 1 ? '再练一遍 ↺' : '下一题 →';
      questionAudio.pause();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function speakWithTTS(text) {
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        questionText.hidden = false;
        textButton.textContent = '隐藏英文问句';
        textButton.setAttribute('aria-expanded', 'true');
        showToast('这台设备暂不支持语音播放，英文问句已显示。');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const englishVoice = voices.find(voice => /^en[-_]/i.test(voice.lang));
      if (englishVoice) {
        utterance.voice = englishVoice;
        utterance.lang = englishVoice.lang;
      } else {
        utterance.lang = 'en-US';
      }
      utterance.rate = slow ? 0.78 : 1;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    document.getElementById('playButton').addEventListener('click', () => {
      const item = questions[current];
      if (item.audio) {
        questionAudio.pause();
        if (!questionAudio.src || questionAudio.src.lastIndexOf(item.audio) !== questionAudio.src.length - item.audio.length) {
          questionAudio.src = item.audio;
        }
        questionAudio.playbackRate = slow ? 0.78 : 1;
        questionAudio.currentTime = 0;
        questionAudio.play().catch(() => speakWithTTS(item.q));
      } else {
        speakWithTTS(item.q);
      }
    });

    textButton.addEventListener('click', () => {
      const willShow = questionText.hidden;
      questionText.hidden = !willShow;
      textButton.textContent = willShow ? '隐藏英文问句' : '看英文问句';
      textButton.setAttribute('aria-expanded', String(willShow));
    });

    answerButton.addEventListener('click', () => {
      const willShow = answerPanel.hidden;
      answerPanel.hidden = !willShow;
      answerButton.textContent = willShow ? '收起参考答案' : '看参考答案';
      answerButton.setAttribute('aria-expanded', String(willShow));
    });

    speedButton.addEventListener('click', () => {
      slow = !slow;
      speedButton.textContent = slow ? '语速：慢速' : '语速：自然';
      speedButton.setAttribute('aria-pressed', String(!slow));
      questionAudio.playbackRate = slow ? 0.78 : 1;
      showToast(slow ? '已切换到慢速。' : '已切换到自然语速。');
    });

    prevButton.addEventListener('click', () => {
      if (current > 0) { current--; renderQuestion(); }
    });
    nextButton.addEventListener('click', () => {
      current = current === questions.length - 1 ? 0 : current + 1;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
