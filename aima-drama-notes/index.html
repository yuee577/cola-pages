<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>爱马追剧口语本</title>
<style>
  :root {
    --ink: #2b2a26; --muted: #7a766c; --paper: #f6f2e9; --card: #fffdf7;
    --orange: #d96f3f; --orange-dark: #b85a2f; --cream: #f3e7d3;
    --line: #e8e0d0; --teal: #3f6e63; --shadow: 0 16px 44px rgba(70,50,30,.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  .page { width: min(100% - 24px, 720px); margin: 0 auto; padding: 20px 0 40px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .brand { font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--orange); }
  .sub { color: var(--muted); font-size: 12px; }
  h1 { margin: 2px 0 6px; font-size: clamp(24px, 6vw, 34px); letter-spacing: -.02em; }
  .lead { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tb {
    min-height: 40px; padding: 8px 13px; border: 1.5px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .tb.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tb:focus-visible { outline: 3px solid rgba(217,111,63,.4); }
  .count { color: var(--muted); font-size: 12px; align-self: center; }
  .note { border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px 0; gap: 8px; }
  .tag { padding: 4px 10px; border-radius: 999px; background: var(--cream); color: #8a6a3f; font-size: 11px; font-weight: 800; }
  .play {
    display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 8px 15px;
    border: 0; border-radius: 13px; background: var(--orange); color: #fff; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .play:active { transform: translateY(1px); }
  .body { padding: 12px 16px 0; }
  .en { font-size: clamp(19px, 5vw, 26px); font-weight: 750; line-height: 1.35; letter-spacing: -.01em; }
  .en.masked .real { visibility: hidden; }
  .en .hint { color: #c9b98f; }
  .zh { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #faf6ec; color: #6a614c; font-size: 14px; line-height: 1.55; }
  .zh[hidden] { display: none; }
  .who { margin-top: 9px; color: var(--muted); font-size: 12px; }
  .parse { margin: 12px 16px; padding: 11px 13px; border-left: 4px solid var(--orange); border-radius: 10px; background: #fbf3e6; }
  .parse b { display: block; margin-bottom: 5px; color: var(--orange-dark); font-size: 12px; letter-spacing: .05em; }
  .parse p { margin: 4px 0; font-size: 13px; line-height: 1.6; color: #5d5344; }
  .parse .ln { color: var(--orange-dark); font-weight: 700; }
  .foot { padding: 0 16px 15px; }
  .how { border: 1.5px dashed #d9c9a8; border-radius: 18px; padding: 15px 17px; background: #fdf9ef; }
  .how h2 { margin: 0 0 8px; font-size: 15px; color: var(--orange-dark); }
  .how ol { margin: 0; padding-left: 20px; color: #6a614c; font-size: 13px; line-height: 1.8; }
  .how .k { color: var(--ink); font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px);
    max-width: calc(100% - 30px); padding: 10px 15px; border-radius: 12px; background: #3a352c; color: #fff;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .18s; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main class="page">
  <div class="top"><span class="brand">EMMA · DRAMA NOTES</span><span class="sub">自己的剧，自己的句子</span></div>
  <h1>追剧口语本</h1>
  <p class="lead">看《降世神通》时捞下来的句子，都存在这里。遮住英文考自己，点开听发音，跟着读一遍。</p>

  <div class="toolbar">
    <button class="tb" id="maskBtn" type="button" aria-pressed="false">🙈 遮住英文，考自己</button>
    <button class="tb on" id="slowBtn" type="button" aria-pressed="true">语速：慢速</button>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>

  <section class="how">
    <h2>📌 怎么往里加新句子</h2>
    <ol>
      <li>看《降世神通》时遇到<span class="k">想学的句子</span>，手机截屏（一句话跨两个画面就截两张）；</li>
      <li>把截图发给 <span class="k">Cola</span>，想说为什么喜欢它也可以说；</li>
      <li>Cola 拆好连读弱读、配好中文，更新到这个网页——<span class="k">你只管按截图</span>。</li>
    </ol>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
  const entries = [
    {
      en: "Only the Avatar mastered all four elements.",
      zh: "只有神通王精通了全部四种元素。",
      who: "《降世神通》S1 · 卡塔拉旁白",
      parse: ["<span class='ln'>Only‿the</span>：连读 /ˈoʊnli ði/，注意 the 在元音前读 /ði/", "Avatar 重音在最前面：A-va-tar", "mastered 结尾 -ed 轻读 /d/，一带而过"]
    },
    {
      en: "Only he could stop the ruthless firebenders.",
      zh: "只有他能阻止冷酷无情的烈火国术师。",
      who: "《降世神通》S1 · 卡塔拉旁白",
      parse: ["ruthless 开头是咬舌音 /θ/——舌尖轻轻放在上下齿之间", "stop 结尾的 /t/ 吞掉不爆破，气到嘴边收住", "firebenders 复合词重音在前：FIRE-benders"]
    },
    {
      en: "But when the world needed him most, he vanished.",
      zh: "但当世界最需要他的时候，他消失了。",
      who: "《降世神通》S1 · 卡塔拉旁白",
      parse: ["<span class='ln'>him‿most</span>：him 弱读成 /ɪm/，h 几乎不发音——就是你上次漏掉的那种小词！", "vanished 结尾 -ed 读 /t/", "最重音落在 most 上：need→ed→him 最轻，most 最重"]
    },
    {
      en: "Leaving me and my brother to look after our tribe.",
      zh: "只留下我和哥哥照看我们的部落。",
      who: "《降世神通》S1 · 卡塔拉旁白",
      parse: ["<span class='ln'>look‿after</span>：经典连读 /lʊk‿æftər/，k 和 a 拼在一起", "to 弱读成 /tə/，千万别读成“图”", "Leaving 的 -ing 鼻音收尾，嘴不要完全闭上"]
    },
    {
      en: "Some people believe that the Avatar was never reborn into the Air Nomads.",
      zh: "有些人认为神通王再也没有转世为气宗人。",
      who: "《降世神通》S1 · 卡塔拉旁白",
      parse: ["<span class='ln'>believe‿that‿the</span>：两个咬舌音连着来，舌尖要快", "was never 弱读链：/wəz ˈnevər/，was 读得像“沃兹”轻轻带过", "reborn 重音在 reb-：re-BORN"]
    },
    {
      en: "And that the cycle is broken, but I haven't lost hope.",
      zh: "轮回已经断了，但我没有失去希望。",
      who: "《降世神通》S1 · 卡塔拉旁白",
      parse: ["cycle 读 /ˈsaɪkl/，别读成“西克尔”", "<span class='ln'>lost‿hope</span>：t 吞音后直接接 hope，断句感很重要", "haven't 的 t 也常吞掉——口语里听感是 /ˈhævn̩ lɒst/"]
    },
    {
      en: "Will you go penguin sledding with me?",
      zh: "你愿意和我一起去滑企鹅雪橇吗？",
      who: "《降世神通》S1 · 卡塔拉对安说",
      parse: ["<span class='ln'>Will‿you</span>：连读 /wɪlju/，口语里常软化成 /wɪljə/", "penguin 读 /ˈpeŋɡwɪn/，重音在前，g 轻轻滑过", "这句超实用：Will you go ___ with me? 换个词就是一句新邀请"]
    }
  ];

  let order = entries.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  let mask = false, slow = true;
  const audio = new Audio(); audio.preload = 'none';
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function render() {
    count.textContent = entries.length + " 句";
    list.innerHTML = '';
    order.forEach(idx => {
      const e = entries[idx];
      const d = document.createElement('div'); d.className = 'note';
      d.innerHTML = `
        <div class="head"><span class="tag">${idx + 1}</span>
          <button class="play" type="button" data-i="${idx}">▶ 听</button></div>
        <div class="body">
          <p class="en ${mask ? 'masked' : ''}" data-en><span class="real">${e.en}</span>${mask ? '<span class="hint">（先想：这句英文怎么说？）</span>' : ''}</p>
          <p class="zh" data-zh hidden>${e.zh}</p>
          <p class="who">📍 ${e.who}</p>
        </div>
        <div class="parse"><b>🎙 发音拆解</b>${e.parse.map(p => `<p>${p}</p>`).join('')}</div>
        <div class="foot"><button class="tb" type="button" data-zh-btn="${idx}">看中文意思</button></div>`;
      list.appendChild(d);
    });
  }

  list.addEventListener('click', ev => {
    const play = ev.target.closest('.play');
    if (play) {
      speak(entries[+play.dataset.i]);
      return;
    }
    const zb = ev.target.closest('[data-zh-btn]');
    if (zb) {
      const card = zb.closest('.note');
      const zh = card.querySelector('[data-zh]');
      zh.hidden = !zh.hidden;
      zb.textContent = zh.hidden ? '看中文意思' : '收起中文';
    }
  });

  function speak(e) {
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(e.en);
      const v = window.speechSynthesis.getVoices().find(v => /^en[-_]/i.test(v.lang));
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
      u.rate = slow ? 0.75 : 1;
      window.speechSynthesis.speak(u);
    } else { showToast('这台设备不支持播放，看文字跟读吧'); }
  }

  document.getElementById('maskBtn').addEventListener('click', function () {
    mask = !mask; this.classList.toggle('on', mask);
    this.setAttribute('aria-pressed', String(mask));
    showToast(mask ? '已遮住英文——先看中文，想出来说出来！' : '英文已显示');
    render();
  });
  document.getElementById('slowBtn').addEventListener('click', function () {
    slow = !slow; this.classList.toggle('on', slow);
    this.setAttribute('aria-pressed', String(slow));
    this.textContent = slow ? '语速：慢速' : '语速：自然';
  });

  render();
</script>
</body>
</html>
